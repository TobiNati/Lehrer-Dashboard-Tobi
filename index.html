<style>
:root{--bg:#f5f6fa;--card:#ffffff;--tx:#161a26;--tx2:#667085;--bd:#e6e8f0;--ac:#5b5bd6;--ac2:#4747c0;--acbg:#ececff;--ok:#12805c;--okbg:#dcf6ec;--warn:#b25e09;--warnbg:#fdf0d5;--bad:#c4314b;--badbg:#fde4ea;--nb:#f0f1f7;--side:#ffffff;--sidetx:#5b6275;--sidehi:#161a26;--sideac:#eef0ff;--onac:#ffffff;--fe:#a21caf;--febg:#fae8ff;--fr:#0f766e;--frbg:#d7f5ee;--sh:0 1px 2px rgba(20,24,40,.05),0 8px 24px rgba(20,24,40,.05)}

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1016;--card:#171a23;--tx:#eceef6;--tx2:#9aa1b5;--bd:#262a38;--ac:#8b8cf8;--ac2:#a5a6fb;--acbg:#23254a;--ok:#5fd3a5;--okbg:#10352a;--warn:#f5c065;--warnbg:#3d2d0f;--bad:#ff8aa0;--badbg:#42182a;--nb:#1e2230;--side:#12141b;--sidetx:#9aa1b5;--sidehi:#ffffff;--sideac:#1d2030;--onac:#10112a;--fe:#e879f9;--febg:#3a1442;--fr:#5eead4;--frbg:#0f3a35;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
aside{background:var(--side);color:var(--sidetx);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:var(--sidehi);font-weight:650;font-size:16px}

.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;color:var(--sidetx);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}

.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:16px 12px 6px;color:var(--sidetx);opacity:.7}

.nv.k small{margin-left:auto;opacity:.65;font-size:12px}
.sidebot{margin-top:auto}

#app{padding:8px 32px 40px;min-width:0}
.mainw{min-width:0}

.gs{position:relative;width:min(440px,100%);margin-top:12px}
.gs>.ic{position:absolute;left:13px;top:11px;color:var(--tx2);pointer-events:none}

.tag.ok{background:var(--okbg);color:var(--ok)}

#app.enter>*{animation:fi .24s ease both}
.ov{animation:fo .15s ease}.sheet{animation:pop .2s ease}

button{transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}

.desk{transition:box-shadow .15s}@media(hover:hover){.desk:hover{box-shadow:var(--sh)}}
.gi,.nv,.tb.rw{transition:background .12s}

button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}

.btn{display:block;width:100%;margin-top:12px;text-align:center}

/* ===== iPad / Touch ===== */

body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.nv,.desk,.chip,.gi{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
aside{padding-left:calc(12px + env(safe-area-inset-left));padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.topbar{padding-top:calc(14px + env(safe-area-inset-top));padding-right:calc(32px + env(safe-area-inset-right))}
#app{padding-bottom:calc(40px + env(safe-area-inset-bottom));padding-right:calc(32px + env(safe-area-inset-right))}
.desk{will-change:transform;contain:layout}
.ban .mini{margin-left:8px}
@media(pointer:coarse){
 button,.nv,.chip{min-height:44px}
 .mini{min-height:40px;padding:8px 14px}
 .nv.k{min-height:40px}
 input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{min-height:44px;font-size:16px}
 .gi{min-height:46px}
 .tb.rw{min-height:46px}
 .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
 .seg button{min-height:42px}
 button:active,.nv:active,.chip:active{transform:scale(.97);transition-duration:.05s}
 .sitz{touch-action:pan-y}
}
@media(max-width:800px){.tb.nt{grid-template-columns:minmax(0,1fr) 44px 64px 104px}.tb.nt>*:nth-child(4){display:block}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .topbar{background:var(--bg)}}
</style>

<body>
<div class="shell"><aside id="side"></aside><div class="mainw"><header id="top" class="topbar"></header><main id="app"></main></div></div>
<div id="modal"></div>
<script>
const KEY='lehrertobi_v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dshort=s=>{const p=s.split('-');return p[2]+'.'+p[1]+'.'};
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const NOTEN=[['1',1],['1-',1.3],['2+',1.7],['2',2],['2-',2.3],['3+',2.7],['3',3],['3-',3.3],['4+',3.7],['4',4],['4-',4.3],['5+',4.7],['5',5],['5-',5.3],['6',6]];
const fmt=v=>{const e=NOTEN.find(n=>Math.abs(n[1]-v)<0.01);return e?e[0]:Number(v).toFixed(1).replace('.',',')};
const notenOpts=sel=>NOTEN.map(n=>`<option value="${n[1]}" ${sel!=null&&Math.abs(sel-n[1])<0.01?'selected':''}>${n[0]}</option>`).join('');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const num=v=>v==null?'–':v.toFixed(1).replace('.',',');
const zn=v=>v==null?'–':String(Math.round(v));
const DAYS=['Mo','Di','Mi','Do','Fr'];
const FERIEN=[['2025-07-14','2025-08-26','Sommerferien'],['2025-10-13','2025-10-25','Herbstferien'],['2025-12-22','2026-01-06','Weihnachtsferien'],['2026-03-30','2026-04-11','Osterferien'],['2026-05-26','2026-05-26','Pfingstferien'],['2026-07-20','2026-09-01','Sommerferien'],['2026-10-17','2026-10-31','Herbstferien'],['2026-12-23','2027-01-06','Weihnachtsferien'],['2027-03-22','2027-04-03','Osterferien'],['2027-05-18','2027-05-18','Pfingstferien'],['2027-07-19','2027-08-31','Sommerferien'],['2027-10-23','2027-11-06','Herbstferien'],['2027-12-24','2028-01-08','Weihnachtsferien'],['2028-04-10','2028-04-22','Osterferien'],['2028-07-10','2028-08-22','Sommerferien'],['2028-10-23','2028-11-04','Herbstferien'],['2028-12-21','2029-01-05','Weihnachtsferien'],['2029-03-26','2029-04-07','Osterferien'],['2029-05-22','2029-05-22','Pfingstferien']];
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dlong=s=>dshort(s)+s.slice(0,4);
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const FTC={};
function feiertage(y){
 if(FTC[y])return FTC[y];const e=easter(y),m={},add=(d,n)=>{m[iso(d)]=n};
 add(new Date(y,0,1),'Neujahr');add(addD(e,-2),'Karfreitag');add(addD(e,1),'Ostermontag');add(new Date(y,4,1),'Tag der Arbeit');add(addD(e,39),'Christi Himmelfahrt');add(addD(e,50),'Pfingstmontag');add(addD(e,60),'Fronleichnam');add(new Date(y,9,3),'Tag der Deutschen Einheit');add(new Date(y,10,1),'Allerheiligen');add(new Date(y,11,25),'1. Weihnachtstag');add(new Date(y,11,26),'2. Weihnachtstag');
 return FTC[y]=m;
}
function dayInfo(ds){const f=feiertage(+ds.slice(0,4))[ds],fe=FERIEN.find(x=>ds>=x[0]&&ds<=x[1]);return{feiertag:f||null,ferien:fe?fe[2]:null}}
function naechste(n){
 const t0=iso(new Date()),y=new Date().getFullYear(),ev=[];
 FERIEN.forEach(f=>{if(f[1]>=t0)ev.push({n:f[2],s:f[0],e:f[1],t:'fr'})});
 [y,y+1].forEach(yy=>{const m=feiertage(yy);Object.keys(m).forEach(d=>{if(d>=t0)ev.push({n:m[d],s:d,e:d,t:'fe'})})});
 ev.sort((a,b)=>a.s.localeCompare(b.s));return ev.slice(0,n);
}
function naechsteHtml(){
 const now=new Date();now.setHours(0,0,0,0);
 const l=naechste(6).map(e=>({e:e,d:Math.round((new Date(e.s+'T00:00:00')-now)/864e5)})).filter(o=>o.d<=50);
 return l.length?l.map(({e,d})=>{
  const when=d<=0?(e.s===e.e?'heute':'bis '+dshort(e.e)):d===1?'morgen':'in '+d+' Tagen';
  const rng=e.s===e.e?dshort(e.s):dshort(e.s)+'–'+dshort(e.e);
  return `<div class="row" style="padding:6px 0;font-size:14px"><span><span class="tag ${e.t}">${e.t==='fe'?'Feiertag':'Ferien'}</span> ${esc(e.n)} <span class="sub">${rng}</span></span><span class="sub" style="white-space:nowrap">${when}</span></div>`}).join(''):'<div class="sub">Keine Ferien oder Feiertage in den nächsten 50 Tagen.</div>';
}
function vKalender(){
 const y=V.year,t=iso(new Date()),fm=feiertage(y),cy=new Date().getFullYear();
 let h=`<div class="ph"><div><h1>Kalender ${y}</h1><div class="sub">Feiertage und Schulferien in Nordrhein-Westfalen</div></div><div class="acts"><button onclick="go({year:${y-1}})">‹ ${y-1}</button><button onclick="go({year:${cy}})">Heute</button><button onclick="go({year:${y+1}})">${y+1} ›</button></div></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px"><span class="tag fe">Feiertag</span><span class="tag fr">Schulferien</span><span class="tag ac">Heute</span></div><div class="months">`;
 for(let m=0;m<12;m++){
  const off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  h+=`<div class="card"><h2>${MONATE[m]}</h2><div class="cal">`+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="ch">${x}</div>`).join('')+'<div></div>'.repeat(off);
  for(let d=1;d<=dim;d++){
   const ds=iso(new Date(y,m,d)),inf=dayInfo(ds),wd=(off+d-1)%7;
   const c=inf.feiertag?'fe':inf.ferien?'fr':wd>=5?'we':'';
   h+=`<div class="cd ${c} ${ds===t?'today':''}" ${inf.feiertag||inf.ferien?`title="${esc(inf.feiertag||inf.ferien)}"`:''}>${d}</div>`;
  }
  h+=`</div></div>`;
 }
 h+=`</div><div class="g2e"><div class="card"><h2>Feiertage ${y}</h2>`+Object.keys(fm).sort().map(d=>`<div class="row"><span>${esc(fm[d])}</span><span class="sub">${new Date(d+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'})}</span></div>`).join('')+`</div><div class="card"><h2>Schulferien ${y}</h2>`;
 const fl=FERIEN.filter(f=>f[0]<=y+'-12-31'&&f[1]>=y+'-01-01');
 h+=fl.length?fl.map(f=>`<div class="row"><span>${esc(f[2])}${f[0]===f[1]?' <span class="sub">(1 Tag)</span>':''}</span><span class="sub">${f[0]===f[1]?dlong(f[0]):dshort(f[0])+' – '+dlong(f[1])}</span></div>`).join(''):'<div class="sub">Für dieses Jahr sind noch keine Ferientermine hinterlegt.</div>';
 h+=`<div class="sub" style="margin-top:10px">Quelle: Ferienordnung des Schulministeriums NRW. Hinzu kommen drei bewegliche Ferientage, die deine Schule festlegt.</div></div></div>`;
 return h;
}

const ICO={clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.5 3.5 6"/>',task:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',cal2:'<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8.5 13h2M13.5 13h2M8.5 16.5h2M13.5 16.5h2"/>',user:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICO[n]}</svg>`;


function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
let AB={h:null,perm:false,last:null,busy:false,err:'',timer:null};
const ABSUP=()=>typeof window!=='undefined'&&'showSaveFilePicker' in window;
function adb(){return new Promise((res,rej)=>{try{const q=indexedDB.open('lehrertobi_auto',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})}
function abPutH(h){return adb().then(db=>{db.transaction('h','readwrite').objectStore('h').put(h,'handle')}).catch(()=>{})}
function abDelH(){return adb().then(db=>{db.transaction('h','readwrite').objectStore('h').delete('handle')}).catch(()=>{})}
function abLoad(){
 if(!ABSUP())return;
 adb().then(db=>{const rq=db.transaction('h').objectStore('h').get('handle');
  rq.onsuccess=async()=>{const h=rq.result;if(!h)return;AB.h=h;
   try{AB.perm=(await h.queryPermission({mode:'readwrite'}))==='granted'}catch(e){AB.perm=false}
   if(AB.perm)abWrite();render()}}).catch(()=>{});
}
async function abPick(){
 try{
  const h=await window.showSaveFilePicker({suggestedName:'lehrer-dashboard-sicherung.json',types:[{description:'Sicherung (JSON)',accept:{'application/json':['.json']}}]});
  AB.h=h;AB.perm=true;AB.err='';await abPutH(h);await abWrite();render();
 }catch(e){if(e&&e.name!=='AbortError'){AB.err='Auswahl nicht möglich: '+e.message;abRefresh()}}
}
async function abResume(){try{AB.perm=(await AB.h.requestPermission({mode:'readwrite'}))==='granted';if(AB.perm)await abWrite()}catch(e){AB.err=e.message}render()}
async function abWrite(){
 if(!AB.h||!AB.perm||AB.busy)return;AB.busy=true;AB.timer=null;
 try{
  const w=await AB.h.createWritable();await w.write(JSON.stringify(Object.assign({},S,{fotos:FOTO}),null,1));await w.close();
  AB.last=new Date();AB.err='';
  const t=iso(new Date());if(S.set.letzterExport!==t){S.set.letzterExport=t;_dirty=true;clearTimeout(_st);_st=setTimeout(flush,250)}
 }catch(e){AB.err='Schreiben fehlgeschlagen: '+((e&&e.message)||e);if(e&&e.name==='NotAllowedError'){AB.perm=false;AB.busy=false;render();return}}
 AB.busy=false;abRefresh();
}
function abSchedule(){if(!AB.h||!AB.perm)return;clearTimeout(AB.timer);AB.timer=setTimeout(abWrite,3000)}
function abNow(){clearTimeout(AB.timer);abWrite()}
function abOff(){AB.h=null;AB.perm=false;clearTimeout(AB.timer);abDelH();render()}
function abRefresh(){const e=$('#abst');if(e)e.innerHTML=abStatus()}
function abStatus(){
 if(!ABSUP())return `<div class="sub">Dieser Browser kann nicht selbstständig in Dateien schreiben (zum Beispiel Safari). Öffne das Dashboard in Chrome oder Edge, dann kannst du die automatische Sicherung einrichten.</div>`;
 if(!AB.h)return `<div class="sub">Noch nicht eingerichtet. Lege die Datei in einen Ordner von Google Drive, iCloud oder OneDrive, dann ist sie auch in der Cloud gesichert.</div><button class="btn pri" onclick="abPick()">Sicherungsdatei wählen</button>`;
 return `<div class="row first"><span>${esc(AB.h.name)}</span><span class="tag ${AB.perm?'ok':'warn'}">${AB.perm?'aktiv':'pausiert'}</span></div><div class="sub">${AB.last?'Zuletzt gesichert um '+AB.last.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'Noch nicht gesichert'}${AB.err?' · '+esc(AB.err):''}</div><div class="acts" style="margin-top:10px">${AB.perm?'<button onclick="abNow()">Jetzt sichern</button>':'<button class="pri" onclick="abResume()">Fortsetzen</button>'}<button onclick="abPick()">Andere Datei wählen</button><button class="dng" onclick="abOff()">Ausschalten</button></div>`;
}
let _st=null,_dirty=false,_fail=false;
function flush(){if(!_dirty)return;_dirty=false;try{localStorage.setItem(KEY,JSON.stringify(S));if(_fail){_fail=false;render()}}catch(e){if(!_fail){_fail=true;render()}}}
function save(){_dirty=true;clearTimeout(_st);_st=setTimeout(flush,250);abSchedule()}
if(typeof addEventListener==='function'){addEventListener('beforeunload',flush);addEventListener('pagehide',flush);if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();if(AB.timer){clearTimeout(AB.timer);abWrite()}}})}

function slot(i){const c=(window.innerWidth||1200)<900?2:4,w=c===2?0.5:0.24;return{x:0.03+(i%c)*w,y:Math.min(0.04+Math.floor(i/c)*0.14,0.9)}}
function autoLayout(ids){return ids.map((sid,i)=>Object.assign({id:uid(),sid:sid},slot(i)))}

function seed(){
 let r=7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
 const VN=['Lena','Ben','Mia','Noah','Emma','Paul','Sofia','Leon','Anna','Finn','Lara','Elias'];
 const NN=['Mustermann','Beispiel','Probst','Bergmann','Lindner','Sommer','Winter','Krause','Fuchs','Roth','Vogel','Maier'];
 const BT=['Musterbau GmbH','Beispiel AG','Werkstatt Sommer','Autohaus Probst KG'];
 const K=[{id:'k1',name:'7a',fach:'Englisch'},{id:'k2',name:'8c',fach:'Englisch'},{id:'k3',name:'9b',fach:'Geschichte'}];
 const sch=[];
 K.forEach((k,ki)=>{for(let i=0;i<8;i++){
  const s={id:uid(),klasse:k.id,vn:VN[(i+ki*3)%12],nn:NN[(i*5+ki*2)%12],tel:'0170 '+(1000000+Math.floor(rnd()*8999999)),betrieb:BT[(i+ki)%BT.length],mail:'',ziel:'',stand:'',noten:[],krank:[],unent:[],notizen:[]};
  const ns=2+Math.floor(rnd()*3),nm=2+Math.floor(rnd()*4);
  for(let j=0;j<ns;j++)s.noten.push({id:uid(),typ:'s',kat:j%2?'Test':'Klassenarbeit',w:NOTEN[2+Math.floor(rnd()*10)][1],d:daysAgo(10+j*14),n:''});
  for(let j=0;j<nm;j++)s.noten.push({id:uid(),typ:'m',kat:j%2?'Vortrag':'Mitarbeit',w:NOTEN[2+Math.floor(rnd()*9)][1],d:daysAgo(3+j*9),n:''});
  sch.push(s)}});
 const s0=sch.find(s=>s.klasse==='k2');
 s0.ziel='Freier sprechen, weniger Angst vor Fehlern';s0.stand='Unit 3, Hörtexte mit Aufgaben';
 s0.notizen.push({id:uid(),d:daysAgo(2),f:daysAgo(-2),t:'Ausbildungsnachweis prüfen',done:false});
 sch.filter(s=>s.klasse==='k1')[2].krank.push(iso(new Date()));
 const sitz={};K.forEach(k=>{sitz[k.id]=autoLayout(sch.filter(s=>s.klasse===k.id).map(s=>s.id))});
 return{klassen:K,schueler:sch,
  plan:{'0-0':'k1','0-1':'k3','0-3':'k2','1-0':'k2','1-2':'k1','1-4':'k3','2-1':'k1','2-3':'k2','3-0':'k3','3-2':'k2','3-3':'k1','4-1':'k2','4-2':'k3','4-4':'k1'},
  planung:{},sitz:sitz,termine:[],
  zeiten:[['07:30','09:00'],['09:20','10:50'],['11:10','12:40'],['13:15','14:45'],['15:00','16:30']],
  set:{gew:50,katS:['Klassenarbeit','Test'],katM:['Mitarbeit','Vortrag','Referat','Hausaufgabe'],faecher:['Englisch','Geschichte','Deutsch','Mathematik'],letzterExport:null}};
}


const TKEY='lehrertobi_theme';
function getTheme(){try{return localStorage.getItem(TKEY)||'auto'}catch(e){return 'auto'}}
function isDark(){const m=getTheme();return m==='dark'||(m==='auto'&&!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches))}
function applyTheme(m){const r=document.documentElement;if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme')}
function setTheme(m){try{localStorage.setItem(TKEY,m)}catch(e){}applyTheme(m);render()}
function toggleTheme(){setTheme(isDark()?'light':'dark')}
try{applyTheme(getTheme())}catch(e){}

let FOTO={},FES=null,FE=null;
function idb(){return new Promise((res,rej)=>{try{const q=indexedDB.open('lehrertobi_fotos',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})}
function fotoPut(id,f){FOTO[id]=f;idb().then(db=>{db.transaction('f','readwrite').objectStore('f').put(f,id)}).catch(()=>{})}
function fotoDel(id){delete FOTO[id];idb().then(db=>{db.transaction('f','readwrite').objectStore('f').delete(id)}).catch(()=>{})}
function fotoClear(){FOTO={};idb().then(db=>{db.transaction('f','readwrite').objectStore('f').clear()}).catch(()=>{})}
function fotoLoad(){idb().then(db=>{const rq=db.transaction('f').objectStore('f').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){FOTO[c.key]=c.value;c.continue()}else render()}}).catch(()=>{})}
function fotoStyle(f){const r=f.r||1,cw=(r>=1?r:1)*f.z,ch=(r>=1?1:1/r)*f.z;return `position:absolute;left:50%;top:50%;width:${cw*100}%;height:${ch*100}%;transform:translate(${-50+f.x/cw*100}%,${-50+f.y/ch*100}%)`}
function avHtml(s,cls){const f=FOTO[s.id];return `<div class="av ${cls}">${f?`<img src="${f.src}" style="${fotoStyle(f)}" alt="" draggable="false">`:esc((s.vn[0]||'')+(s.nn[0]||''))}</div>`}
function fotoModal(sid){FES=sid;FE=FOTO[sid]?Object.assign({},FOTO[sid]):null;fotoShow()}
function fotoShow(){
 const s=sc(FES);
 modal(`<h2>Foto <span class="sub">${esc(nameOf(s))}</span></h2>
 <div id="fe_vp" class="fvp" ${FE?'':'style="display:grid;place-items:center"'}>${FE?`<img id="fe_img" src="${FE.src}" style="${fotoStyle(FE)}" alt="" draggable="false">`:'<span class="sub">Noch kein Foto</span>'}</div>
 ${FE?`<label>Zoom<input type="range" id="fe_z" min="1" max="4" step="0.05" value="${FE.z}" oninput="feZoom(this.value)"></label><div class="sub">Foto mit Maus oder Finger ziehen zum Verschieben. Zoom per Regler, Mausrad oder mit zwei Fingern.</div>`:''}
 <label>Foto auswählen<input type="file" accept="image/*" onchange="feFile(this)"></label>

/* ---------- Import: Klasse aus PDF, Scan, Foto, Excel, CSV oder Text ---------- */
const LIB={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
 xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',ocr:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'};
const _js={};
function loadJS(u){return _js[u]=_js[u]||new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>{delete _js[u];rej(new Error('Bibliothek konnte nicht geladen werden. Bitte mit dem Internet verbinden.'))};document.head.appendChild(s)})}
const IMF=[['','ignorieren'],['nn','Nachname'],['vn','Vorname'],['name','Name (Nach- und Vorname)'],['klasse','Klasse'],['betrieb','Betrieb'],['mail','E-Mail'],['tel','Telefon']];
const IMC=[['nn','Nachname'],['vn','Vorname'],['klasse','Klasse'],['betrieb','Betrieb'],['mail','E-Mail'],['tel','Telefon']];
/* Reihenfolge zählt: „Telefon Betrieb“ ist Telefon, „E-Mail Ausbilder“ ist E-Mail, „Ausbildungsberuf“ wird ignoriert */
const IMH=[['',/^(nr\.?|lfd\.?( nr\.?)?|#|pos\.?|geschlecht|m\/w|konf|religion|staat|nation|bemerk)|fax/],['mail',/mail/],['tel',/tel|fon|handy|mobil|notfall|phone/],['betrieb',/betrieb|firma|unternehmen|arbeitgeber|ausbildungsst|praktikum/],['',/geb|geburt|plz|postleitzahl|^(wohn)?ort\b|^stadt|stra(ss|ß)e|^str\.?$|anschrift|adresse|beruf|eltern|erziehungs|mutter|vater/],['klasse',/^klasse|^kl\.?$|^lerngruppe|^kurs/],['vn',/vorname|rufname/],['nn',/nachname|familienname|zuname/],['name',/^(name|schüler(in|innen)?|schülername|name des schülers|auszubildende[r]?|azubi)\b/]];
const RX={date:/^\d{1,2}\.\s?\d{1,2}\.\s?(\d{2}|\d{4})$/,mail:/^\S+@\S+\.\S+$/,tel:/^(\+|0|\()[\d\s\/()\-.]{5,}$/,plz:/^\d{5}$/,plzort:/^\d{5}\s+\D/,str:/\D{3,}\s*\d+\s*[a-z]?(\s*[-\/]\s*\d+[a-z]?)?$/i,
 klasse:/^(\d{1,2}\s?[a-z]{0,2}|[a-z]{1,6}\s?\d{1,4}\s?[a-z]{0,2}|ef|q1|q2|e1|e2)$/i,name:/^[A-ZÄÖÜÉ][\p{L}'\-]+(\s+[\p{L}'\-]+)*$/u,firma:/\b(gmbh|ag|kg|ohg|ug|mbh|gbr|e\.\s?k\.?|e\.\s?v\.?|co\.?|& co)\b|betrieb|werk|handel|service|bau\b/i,junk:/seite\s*\d|^\s*(klassenliste|schülerliste|schuljahr|stand\b|gedruckt|druckdatum|summe|anzahl|gesamt|unterschrift)/i};
let IM=null;
function importModal(kid){
 IM={kid:kid||null};
 modal(`<h2>Klasse importieren</h2>
 <div class="sub">PDF, Scan, Foto einer Liste, Excel, ODS, CSV oder Text. Die Datei bleibt auf diesem Gerät und wird nirgends hochgeladen. Beim ersten Mal lädt die App die Lesehilfen aus dem Internet.</div>
 <label>Datei wählen<input type="file" id="im_f" accept=".pdf,.csv,.txt,.tsv,.xlsx,.xls,.ods,image/*,application/pdf"></label>
 <label>oder Liste einfügen<textarea class="grow" id="im_t" placeholder="Eine Zeile pro Schüler, z. B. Müller; Anna; 8c"></textarea></label>
 <label class="chk"><input type="checkbox" id="im_o"> Texterkennung erzwingen (für eingescannte PDFs)</label>
 <div class="sub" id="im_s"></div>
 <div class="btns"><button onclick="closeModal()">Abbrechen</button><button class="pri" onclick="imRead()">Einlesen</button></div>`);
}
const imStat=t=>{const e=$('#im_s');if(e)e.textContent=t};
async function imRead(){
 const f=$('#im_f').files[0],txt=$('#im_t').value,ocr=$('#im_o').checked;
 if(!f&&!txt.trim())return imStat('Bitte eine Datei wählen oder eine Liste einfügen.');
 try{
  let src;
  if(!f)src={lines:textLines(txt)};
  else{
   const n=f.name.toLowerCase();IM.file=f.name;
   if(n.endsWith('.pdf')||f.type==='application/pdf')src=await readPdf(f,ocr);
   else if(f.type.startsWith('image/')||/\.(jpe?g|png|heic|heif|webp|gif|bmp|tiff?)$/.test(n))src={lines:wordsToLines(await ocrImages([f]))};
   else if(/\.(xlsx|xls|ods)$/.test(n))src=await readSheet(f);
   else src={lines:textLines(await readText(f))};
  }
  imBuild(src);
 }catch(e){imStat('Fehler: '+(e&&e.message||e))}
}
async function readText(f){const b=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1252').decode(b)}}
function textLines(t){
 const ls=t.replace(/\r/g,'').split('\n').filter(l=>l.trim());
 const d=[';','\t','|',','].map(c=>[c,ls.slice(0,20).filter(l=>l.includes(c)).length]).sort((a,b)=>b[1]-a[1])[0];
 const delim=d[1]>=Math.max(1,ls.slice(0,20).length*0.6)?d[0]:null;
 return ls.map(l=>({cells:delim?csvSplit(l,delim):l.trim().split(/\t|\s{2,}/)}));
}
function csvSplit(l,d){const out=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else if(ch==='"')q=true;else if(ch===d){out.push(c);c=''}else c+=ch}out.push(c);return out.map(x=>x.trim())}
async function readSheet(f){
 imStat('Tabelle wird gelesen …');await loadJS(LIB.xlsx);
 const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false}),lines=[];
 wb.SheetNames.forEach(sn=>{XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''}).forEach(r=>{if(r.some(c=>String(c).trim()))lines.push({cells:r.map(c=>String(c).trim()),hint:wb.SheetNames.length>1?sn:null})})});
 return {lines:lines};
}
async function readPdf(f,force){
 imStat('PDF wird gelesen …');await loadJS(LIB.pdf);
 pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
 const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,words=[];let chars=0;
 for(let p=1;p<=doc.numPages;p++){
  const tc=await (await doc.getPage(p)).getTextContent();
  tc.items.forEach(it=>{const s=it.str.trim();if(!s)return;chars+=s.length;const tr=it.transform,h=it.height||Math.hypot(tr[2],tr[3])||10;
   words.push({t:s,x0:tr[4],x1:tr[4]+(it.width||s.length*h*0.5),y:p*1e5-tr[5],h:h})});
 }
 if(!force&&chars>=15*doc.numPages)return {lines:wordsToLines(words,0.45)};
 const pages=[];
 for(let p=1;p<=doc.numPages;p++){imStat(`Seite ${p} von ${doc.numPages} wird für die Texterkennung vorbereitet …`);
  const pg=await doc.getPage(p),vp=pg.getViewport({scale:2.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pages.push(c)}
 return {lines:wordsToLines(await ocrImages(pages))};
}
async function ocrImages(imgs){
 imStat('Texterkennung wird geladen …');await loadJS(LIB.ocr);
 let cur=0;
 const w=await Tesseract.createWorker('deu',1,{logger:m=>{if(m.status==='recognizing text')imStat(`Texterkennung${imgs.length>1?' Seite '+(cur+1)+' von '+imgs.length:''}: ${Math.round(m.progress*100)} %`);else if(m.status)imStat('Texterkennung: '+m.status+' …')}});
 const words=[];
 try{for(cur=0;cur<imgs.length;cur++){const r=await w.recognize(imgs[cur]);(r.data.words||[]).forEach(x=>{if(x.confidence<10||!x.text.trim())return;const b=x.bbox;words.push({t:x.text.trim(),x0:b.x0,x1:b.x1,y:cur*1e5+(b.y0+b.y1)/2,h:b.y1-b.y0,lc:x.confidence<60})})}}
 finally{await w.terminate()}
 return words;
}
/* Wörter mit Position → Zeilen → Zellen (Lücke breiter als gap × Zeichenhöhe trennt Spalten) */
function wordsToLines(ws,gap){
 gap=gap||0.9;
 ws=ws.slice().sort((a,b)=>a.y-b.y||a.x0-b.x0);const lines=[];
 ws.forEach(w=>{const l=lines[lines.length-1];if(l&&Math.abs(w.y-l.y)<Math.max(3,0.55*Math.min(w.h,l.h)))l.ws.push(w);else lines.push({y:w.y,h:w.h,ws:[w]})});
 return lines.map(l=>{l.ws.sort((a,b)=>a.x0-b.x0);const cells=[];let c=null;
  l.ws.forEach(w=>{if(c&&w.x0-c.x1<gap*l.h){c.t+=' '+w.t;c.x1=w.x1;c.lc=c.lc||w.lc}else{c={t:w.t,x0:w.x0,x1:w.x1,lc:w.lc};cells.push(c)}});
  return {cells:cells.map(c=>c.t),pos:cells,ws:l.ws,h:l.h}});
}
const imNorm=s=>String(s||'').toLowerCase().replace(/[.:]/g,'').trim();
function headField(c){const t=imNorm(c);if(!t||t.length>40||/@|\d{2}/.test(t))return null;for(const [f,r] of IMH)if(r.test(t))return f;return null}
function imBuild(src){
 const lines=src.lines.filter(l=>l.cells.some(c=>c.trim()));
 if(!lines.length)return imStat('In der Datei wurde kein Text gefunden. Bei Scans hilft „Texterkennung erzwingen“.');
 /* Klassenname aus Überschrift oder Dateiname */
 let hint=null;
 for(const l of lines.slice(0,15)){const m=l.cells.join(' ').match(/klasse\s*:?\s*([a-z]{0,6}\s?\d{1,4}\s?[a-z]{0,2}|ef|q1|q2)\b/i);if(m){hint=m[1].replace(/\s/g,'');break}}
 if(!hint&&IM.file){const m=IM.file.replace(/\.[a-z0-9]+$/i,'').match(/(?:^|[^a-z\d])([a-z]{0,6}\d{1,4}[a-z]{0,2}|ef|q1|q2)(?:[^a-z\d]|$)/i);if(m)hint=/^[a-z]+\d/i.test(m[1])?m[1].toUpperCase():m[1]}
 /* Kopfzeile: die Zeile mit den meisten erkannten Spalten, mindestens zwei (ein Titel wie „Klasse: 8c“ zählt weniger) */
 const hs=lines.map(l=>l.cells.filter(c=>headField(c)).length),hm=Math.max(0,...hs);
 let hi=hm>=2?hs.indexOf(hm):-1;
 let rows,map;
 if(hi>=0){
  let H=lines[hi];
  /* mehrzeilige Kopfzeile, z. B. „Geb.-“ darüber und „Datum“ darunter */
  if(H.pos){
   const pos=H.pos.map(c=>Object.assign({},c)),part=l=>l&&l.pos&&l.cells.length<H.cells.length/2&&!/\d/.test(l.cells.join(''))&&Math.abs(l.ws[0].y-H.ws[0].y)<2*H.h;
   const merge=(l,above)=>l.pos.forEach(c=>{const o=pos.find(p=>c.x0<p.x1&&c.x1>p.x0);if(o)o.t=above?c.t+' '+o.t:o.t+' '+c.t;else pos.push(Object.assign({},c))});
   const up=part(lines[hi-1]),dn=part(lines[hi+1]);
   if(dn){merge(lines[hi+1],false);lines.splice(hi+1,1)}
   if(up){merge(lines[hi-1],true);lines.splice(hi-1,1);hi--}
   pos.sort((a,b)=>a.x0-b.x0);H={cells:pos.map(c=>c.t),pos:pos,ws:H.ws,h:H.h};
  }
  map=H.cells.map(headField).map(f=>f||'');
  if(map.includes('name')&&map.includes('vn'))map=map.map(f=>f==='name'?'nn':f);
  const body=lines.slice(hi+1).filter(l=>l.cells.join('|')!==H.cells.join('|')&&!(l.cells.filter(c=>headField(c)).length>=2));
  const bnd=H.pos?colBounds(H,body):null;
  rows=body.map(l=>{const a=bnd&&l.ws?alignTo(bnd,l.ws):pad(l.cells,H.cells.length);return {cells:a,lc:a.lc||[],hint:l.hint,y:l.ws?l.ws[0].y:null,h:l.h}});
  IM.head=H.cells;
 }else{
  const n=Math.max(...lines.map(l=>l.cells.length));

const pad=(a,n)=>a.concat(Array(Math.max(0,n-a.length)).fill(''));
/* Spaltengrenzen: wo die Einträge unter einer Überschrift wirklich beginnen (oft etwas links davon) */
function colBounds(H,body){
 const hp=H.pos,h=H.h,xs=[];body.forEach(l=>(l.pos||[]).forEach(c=>xs.push(c.x0)));
 return hp.slice(1).map((c,i)=>{const lo=Math.max(hp[i].x0+0.5*h,c.x0-2.5*h),near=xs.filter(x=>x>=lo&&x<=c.x0+0.3*h);

}
function alignTo(b,ws){
 const out=Array.from({length:b.length+1},()=>[]);
 const lc=out.map(()=>false);
 ws.forEach(w=>{let i=0;while(i<b.length&&w.x0>=b[i])i++;out[i].push(w.t);if(w.lc)lc[i]=true});

function guessMap(rows,n){
 const map=[],used={};
 for(let i=0;i<n;i++){
  const v=rows.map(r=>(r.cells[i]||'').trim()).filter(Boolean);
  const fr=rx=>v.length?v.filter(x=>rx.test(x)).length/v.length:0;
  let f='';

  else if(v.every((x,j)=>/^\d+\.?$/.test(x))&&v.map(x=>parseInt(x)).every((x,j,a)=>!j||x===a[j-1]+1))f='';
  else if(fr(RX.mail)>0.5)f='mail';
  else if(fr(RX.date)>0.5||fr(RX.plzort)>0.5||fr(RX.plz)>0.5)f='';
  else if(fr(RX.tel)>0.5)f='tel';
  else if(fr(RX.firma)>0.3)f='betrieb';
  else if(fr(RX.str)>0.5)f='';
  else if(fr(RX.klasse)>0.6)f='klasse';
  else if(v.filter(x=>/^[mwd]$/i.test(x)).length/v.length>0.6)f='';
  else if(v.filter(x=>x.includes(',')&&RX.name.test(x.replace(',',''))).length/v.length>0.5)f='name';
  else if(fr(RX.name)>0.5){f=!used.nn&&!used.name?'nn':!used.vn&&!used.name?'vn':'betrieb'}
  if(f&&f!=='tel'&&used[f])f='';
  if(f)used[f]=1;map.push(f);
 }
 /* nur eine Namensspalte ohne Komma: als Name (Nach- und Vorname) lesen */
 if(used.nn&&!used.vn)map[map.indexOf('nn')]='name';

}
const tCase=s=>s.replace(/^[^\p{L}]+|[^\p{L}.]+$/gu,'').replace(/[\p{Lu}]{2,}/gu,w=>w[0]+w.slice(1).toLowerCase());
function splitName(s){

 return {nn:p[0],vn:p.slice(1).join(' ')};
}
function imRecs(){
 const recs=[],orph=[],m=IM.map;
 IM.rows.forEach(r=>{
  const o={},lc={},add=(k,v,sep)=>{v=(v||'').trim();if(v)o[k]=o[k]?o[k]+(sep||', ')+v:v};
  m.forEach((f,i)=>{const v=(r.cells[i]||'').trim();if(!f||!v)return;
   if(r.lc&&r.lc[i])(f==='name'?['nn','vn']:['str','plz','ort','plzort'].includes(f)?['adr']:[f]).forEach(k=>lc[k]=1);
   if(f==='mail')add('mail',v.replace(/\s+/g,'').replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi,''),', ');else if(f==='name')Object.assign(o,splitName(v));else if(f==='tel')add('tel',v,' / ');else add(f,f==='nn'||f==='vn'?tCase(v):v,f==='nn'||f==='vn'?' ':', ')});
  const has=o.nn||o.vn,joined=r.cells.join(' ');
  if(!has){/* Fortsetzungszeile, z. B. umbrochene Adresse; gehört zur nächstgelegenen Schülerzeile */
   if(Object.keys(o).length&&!RX.junk.test(joined))orph.push({o:o,lc:lc,y:r.y,after:recs.length});return}
  if(RX.junk.test(joined)||/\d/.test((o.nn||'')+(o.vn||'')))return;
  o.klasse=(o.klasse||r.hint||IM.hint||'').replace(/\s/g,'');
  o._y=r.y;o._h=r.h;o._lc=lc;recs.push(o);
 });
 recs.forEach(o=>{if(o.betrieb)o.betrieb=o.betrieb.replace(/\s*\b(herr|frau)\.?$/i,'').trim()});
 orph.forEach(x=>{
  const a=recs[x.after-1],b=recs[x.after];let t=a,above=false;
  if(b&&x.y!=null&&b._y!=null&&(!a||Math.abs(b._y-x.y)<Math.abs(x.y-a._y)))t=b,above=true;
  if(!t)return;
  Object.assign(t._lc,x.lc);
  Object.keys(x.o).forEach(k=>{const v=x.o[k],sep=' ';t[k]=t[k]?(above?v+sep+t[k]:t[k]+sep+v):v});
 });

 imDupes();
}
function imDupes(){IM.recs.forEach(r=>{const t=imTarget(r.klasse);r.dup=!!(t&&t.kid&&S.schueler.some(s=>s.klasse===t.kid&&s.nn.toLowerCase()===r.nn.toLowerCase()&&s.vn.toLowerCase()===r.vn.toLowerCase()));if(r.dup)r.on=false})}

function imTarget(g){

 if(!IM.tg[g]){const ex=IM.kid?kl(IM.kid):null;IM.tg[g]=ex?{kid:ex.id}:{kid:'',name:g||IM.hint||'',fach:S.set.faecher[0]||''}}

/* Rot: von der Texterkennung unsicher gelesen, leer obwohl die Liste eine Spalte dafür hat, oder unplausibel */
function imCheck(k,v,r){
 v=(v||'').trim();if(r.lc&&r.lc[k])return true;
 if(k==='nn'||k==='vn')return !v||/[\d@]/.test(v);
 if(k==='klasse')return !v;
 if(!v)return IM.map.some(f=>(k==='adr'?['str','plz','ort','plzort','adr']:[k]).includes(f));
 if(k==='mail')return v.split(/\s*,\s*/).some(x=>!RX.mail.test(x));

const imBadN=()=>IM.recs.filter(r=>r.on).reduce((n,r)=>n+IMC.filter(([k])=>imCheck(k,r[k],r)).length,0);

function bindSitz(){
 const box=$('#sitz');if(!box)return;const kid=box.dataset.k;
 box.querySelectorAll('.desk').forEach(el=>{
  el.onpointerdown=e=>{
   if(e.button>0)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
   const r=box.getBoundingClientRect(),d=S.sitz[kid].find(x=>x.id===el.dataset.id);if(!d)return;
   const sx=e.clientX,sy=e.clientY,ox=d.x*r.width,oy=d.y*r.height,W=el.offsetWidth,H=el.offsetHeight;let moved=false,raf=0,tx=0,ty=0,nx=ox,ny=oy;
   const apply=()=>{raf=0;el.style.transform=`translate(${tx}px,${ty}px)`};
   const end=ok=>{el.onpointermove=el.onpointerup=el.onpointercancel=null;if(raf){cancelAnimationFrame(raf);raf=0}
    if(moved){d.x=nx/r.width;d.y=ny/r.height;el.style.transform='';el.style.left=d.x*100+'%';el.style.top=d.y*100+'%';el.style.zIndex='';el.style.boxShadow='';if(ok)save()}

  };
 });

/* ---------- Stundenplan: Wochenraster und Einträge mit Wiederholung ---------- */
const WDH=[['einmal','Einmalig'],['taeglich','Täglich (Mo–Fr)'],['woechentlich','Wöchentlich'],['zweiwoechentlich','Alle 2 Wochen'],['monatlich','Monatlich']];
const WT7=['Mo','Di','Mi','Do','Fr','Sa','So'];
const wdOf=ds=>(new Date(ds+'T00:00:00').getDay()+6)%7;
const minOf=z=>{const p=String(z||'0:0').split(':');return +p[0]*60+ +p[1]};
function occurs(t,ds,free){
 if(ds<t.start||(t.aus||[]).includes(ds))return false;
 if(t.wdh==='einmal')return ds===t.start;
 if(t.ende&&ds>t.ende)return false;
 if(free&&t.ferien!==false)return false;
 const wd=wdOf(ds);
 if(t.wdh==='taeglich')return wd<5;
 if(t.wdh==='monatlich')return ds.slice(8)===t.start.slice(8);
 if(!(t.tage||[]).includes(wd))return false;
 if(t.wdh==='zweiwoechentlich'){const m0=addD(new Date(t.start+'T00:00:00'),-wdOf(t.start)),dd=Math.round((new Date(ds+'T00:00:00')-m0)/864e5);return Math.floor(dd/7)%2===0}
 return true;
}
/* Alle Stunden eines Tages: Wochenraster aus den Einstellungen plus Einträge */
function lessonsOn(ds){
 const inf=dayInfo(ds),free=!!(inf.feiertag||inf.ferien),wd=wdOf(ds),out=[];
 if(wd<5&&!free)S.zeiten.forEach((z,i)=>{const kid=S.plan[wd+'-'+i];if(kid&&kl(kid))out.push({key:ds+'|'+i,nr:i+1,von:z[0],bis:z[1],k:kl(kid)})});
 S.termine.forEach(t=>{if(occurs(t,ds,free))out.push({key:ds+'|'+t.id,von:t.von,bis:t.bis,k:t.kid?kl(t.kid):null,titel:t.titel,raum:t.raum,t:t})});
 return out.sort((a,b)=>a.von.localeCompare(b.von));
}
const lesLabel=l=>(l.k?esc(l.k.name)+' · '+esc(l.titel||l.k.fach):esc(l.titel||'Termin'))+(l.raum?' · '+esc(l.raum):'');
function sjEnde(ds){const sj=S.set.sj;if(sj&&sj.ende&&ds<=sj.ende&&ds>=(sj.start||''))return sj.ende;const f=FERIEN.find(x=>x[2]==='Sommerferien'&&x[0]>ds);return f?iso(addD(new Date(f[0]+'T00:00:00'),-1)):''}
function hjEnde(ds){const sj=S.set.sj;if(sj&&sj.hj&&sj.start&&ds>=sj.start&&ds<sj.hj)return iso(addD(new Date(sj.hj+'T00:00:00'),-1));if(sj&&sj.hj&&sj.ende&&ds>=sj.hj&&ds<=sj.ende)return sj.ende;const y=+ds.slice(0,4),j=(+ds.slice(5,7)>=8?y+1:y)+'-01-31';return ds<=j?j:sjEnde(ds)}
function wdhText(t){
 const tg=(t.tage||[]).slice().sort().map(i=>WT7[i]).join(', ');
 const w={einmal:'Einmalig am '+dlong(t.start),taeglich:'Täglich Mo–Fr',woechentlich:'Jede Woche '+tg,zweiwoechentlich:'Alle 2 Wochen '+tg,monatlich:'Monatlich am '+(+t.start.slice(8))+'.'}[t.wdh];
 return w+' · '+t.von+'–'+t.bis+(t.wdh!=='einmal'?' · '+dshort(t.start)+'–'+dlong(t.ende):'');
}
function countOcc(t){
 if(t.wdh==='einmal')return 1;
 let n=0;const e=t.ende||t.start;
 for(let d=new Date(t.start+'T00:00:00'),i=0;i<800;i++,d=addD(d,1)){const ds=iso(d);if(ds>e)break;const inf=dayInfo(ds);if(occurs(t,ds,!!(inf.feiertag||inf.ferien)))n++}
 return n;
}
function vStundenplan(){
 const now=new Date();now.setHours(0,0,0,0);
 const td=iso(now),mon=addD(now,-wdOf(td)+7*V.week),fri=addD(mon,4);
 let h=`<div class="ph"><div><h1>Stundenplan</h1><div class="sub">${V.spv==='liste'?S.termine.length+(S.termine.length===1?' Eintrag':' Einträge'):dshort(iso(mon))+'–'+dlong(iso(fri))}</div></div>
 <div class="acts">${V.spv==='liste'?'':`<button onclick="go({week:${V.week-1}})">‹ Vorherige</button><button onclick="go({week:0})">Diese Woche</button><button onclick="go({week:${V.week+1}})">Nächste ›</button>`}<button onclick="spModal()">Aus PDF übernehmen</button><button class="pri" onclick="terminModal()">+ Eintrag</button></div></div>
 <div class="seg"><button class="${V.spv!=='liste'?'on':''}" onclick="go({spv:'woche'})">Woche</button><button class="${V.spv==='liste'?'on':''}" onclick="go({spv:'liste'})">Alle Einträge</button></div>`;
 if(V.spv==='liste'){
  const l=S.termine.slice().sort((a,b)=>a.start.localeCompare(b.start)||a.von.localeCompare(b.von));
  h+=`<div class="card">${l.length?l.map(t=>`<div class="row click" onclick="terminModal('${t.id}')"><span><b>${lesLabel({k:t.kid?kl(t.kid):null,titel:t.titel,raum:t.raum})}</b><div class="sub">${wdhText(t)} · ${countOcc(t)} ${countOcc(t)===1?'Termin':'Termine'}${(t.aus||[]).length?', davon '+t.aus.length+' einzeln abgesagt':''}</div></span><span class="tag">Bearbeiten</span></div>`).join(''):'<div class="sub">Noch keine Einträge. Lege mit „+ Eintrag“ deine Stunden an, z. B. jeden Dienstag 08:00–09:30 bis zum Halbjahresende.</div>'}</div>`;
  if(Object.keys(S.plan).length)h+=`<div class="sub" style="margin-top:10px">Dazu kommt das Stundenraster aus den <button class="crumb" onclick="go({tab:'mehr'})">Einstellungen</button>, das jede Woche gleich ist.</div>`;
  return h;
 }
 const days=[0,1,2,3,4].map(i=>{const ds=iso(addD(mon,i)),inf=dayInfo(ds);return{ds:ds,inf:inf,ls:lessonsOn(ds)}});
 const all=[].concat(...days.map(d=>d.ls));
 const zm=S.zeiten.map(z=>[minOf(z[0]),minOf(z[1])]);
 const t0=Math.min(7*60+30,...zm.map(z=>z[0]),...all.map(l=>minOf(l.von)))-15,t1=Math.max(14*60,...zm.map(z=>z[1]),...all.map(l=>minOf(l.bis)))+15;
 const a=Math.floor(t0/60)*60,b=Math.ceil(t1/60)*60,PX=1.15,H=(b-a)*PX,nowM=new Date().getHours()*60+new Date().getMinutes();
 const hrs=[];for(let m=a;m<=b;m+=60)hrs.push(m);
 h+=`<div class="ttw"><div class="tt"><div></div>${days.map((d,i)=>`<div class="tt-hd ${d.ds===td?'today':''}"><span>${DAYS[i]} <span class="sub">${dshort(d.ds)}</span></span><button class="ghost" title="Eintrag an diesem Tag" onclick="terminModal(null,'${d.ds}')">+</button></div>`).join('')}
 <div class="tt-ax" style="height:${H}px">${zm.length?zm.map((z,i)=>`<em class="tt-bn" style="top:${(z[0]-a)*PX}px;height:${(z[1]-z[0])*PX}px"><span>${S.zeiten[i][0]}</span><b>${i+1}.</b><span>${S.zeiten[i][1]}</span></em>`).join(''):hrs.map(m=>`<span style="top:${(m-a)*PX}px">${String(m/60).padStart(2,'0')}:00</span>`).join('')}</div>`;
 days.forEach(d=>{
  const free=d.inf.feiertag||d.inf.ferien,lanes=[];
  d.ls.forEach(l=>{let k=lanes.findIndex(e=>e<=minOf(l.von));if(k<0){k=lanes.length;lanes.push(0)}lanes[k]=minOf(l.bis);l.lane=k});
  const n=Math.max(1,lanes.length);
  h+=`<div class="tt-c ${d.inf.feiertag?'fe':d.inf.ferien?'fr':''}" style="height:${H}px">${zm.map(z=>`<div class="tt-r" style="top:${(z[0]-a)*PX}px;height:${(z[1]-z[0])*PX}px"></div>`).join('')}${free?`<span class="free tag ${d.inf.feiertag?'fe':'fr'}">${esc(free)}</span>`:''}
  ${d.ls.map(l=>{const top=(minOf(l.von)-a)*PX,ht=Math.max(30,(minOf(l.bis)-minOf(l.von))*PX-2),now=d.ds===td&&nowM>=minOf(l.von)&&nowM<=minOf(l.bis),pl=S.planung[l.key];
   return `<div class="tt-b ${now?'now':''} ${l.t?'':'ras'} ${ht<44?'sm':''}" style="top:${top}px;height:${ht}px;left:calc(${l.lane*100/n}% + 3px);width:calc(${100/n}% - 6px)" onclick="lesModal('${d.ds}','${l.key}')" title="${l.von}–${l.bis} ${l.k?esc(l.k.name+' '+l.k.fach):esc(l.titel||'')}">
   <b>${l.k?esc(l.k.name):esc(l.titel||'Termin')}</b><span>${l.von}–${l.bis}</span>${l.k?`<span>${esc(l.titel||l.k.fach)}</span>`:''}${l.raum?`<span>${esc(l.raum)}</span>`:''}${pl?`<span>📝 ${esc(pl)}</span>`:''}</div>`}).join('')}</div>`;
 });
 return h+`</div></div><div class="sub" style="margin-top:10px">Stunde antippen für die Planung. Die grauen Bänder sind die Blöcke deines Stundenrasters. Gestrichelte Stunden kommen aus dem festen Raster in den Einstellungen.</div>`;
}

function tmRead(){return{kid:$('#tm_k').value,titel:$('#tm_t').value.trim(),raum:$('#tm_r').value.trim(),von:$('#tm_v').value,bis:$('#tm_b').value,wdh:$('#tm_w').value,tage:Array.from(document.querySelectorAll('#tm_tg input')).filter(x=>x.checked).map(x=>+x.value),start:$('#tm_s').value,ende:$('#tm_e').value,ferien:$('#tm_f').checked}}
function tmErr(o){
 if(!o.kid&&!o.titel)return 'Bitte eine Klasse wählen oder einen Titel eingeben.';
 if(!o.von||!o.bis||o.bis<=o.von)return 'Die Endzeit muss nach der Anfangszeit liegen.';
 if(!o.start)return 'Bitte ein Datum wählen.';
 if(o.wdh!=='einmal'){if(!o.ende)return 'Bitte ein Ende wählen, z. B. das Halbjahresende.';if(o.ende<o.start)return 'Das Ende liegt vor dem Beginn.';if((o.wdh==='woechentlich'||o.wdh==='zweiwoechentlich')&&!o.tage.length)return 'Bitte mindestens einen Wochentag wählen.'}

}
function tmUpd(){
 const o=tmRead(),w=o.wdh,e=tmErr(o),n=$('#tm_n');
 $('#tm_tg').style.display=w==='woechentlich'||w==='zweiwoechentlich'?'':'none';
 ['#tm_el','#tm_q','#tm_fl'].forEach(x=>{$(x).style.display=w==='einmal'?'none':''});
 $('#tm_sl span').textContent=w==='einmal'?'Datum':'Beginn';
 n.style.color=e?'var(--bad)':'';n.textContent=e||(w==='einmal'?'Ein einzelner Termin.':'Ergibt '+countOcc(Object.assign({aus:[]},o))+' Termine im gewählten Zeitraum.');

function terminSave(id){
 const o=tmRead(),e=tmErr(o);if(e){tmUpd();return}
 if(o.wdh!=='woechentlich'&&o.wdh!=='zweiwoechentlich')o.tage=[];
 if(id)Object.assign(S.termine.find(x=>x.id===id),o);else S.termine.push(Object.assign({id:uid(),aus:[]},o));

function terminDel(id){ask('Eintrag mit allen Terminen löschen?',()=>{S.termine=S.termine.filter(x=>x.id!==id);save();render()})}
function terminAusReset(id){S.termine.find(x=>x.id===id).aus=[];save();terminModal(id)}

/* ---------- Stundenplan aus PDF (z. B. Untis-Lehrerplan): Tage als Spalten, Stunden als Zeilen ---------- */
let SPI=null;
const DAYKEY=['mo','di','mi','do','fr','sa'];
const HJT=[['','ganzes Jahr'],['1','1. Halbjahr'],['2','2. Halbjahr']];
const isoDE=s=>{const m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''};
function sjDefault(){
 const sj=S.set.sj||{},t=iso(new Date()),y=+t.slice(0,4)-(+t.slice(5,7)<8?1:0);
 const sf=FERIEN.find(f=>f[2]==='Sommerferien'&&f[0].startsWith(String(y))),start=sf?iso(addD(new Date(sf[1]+'T00:00:00'),1)):y+'-08-15';
 return {start:sj.start||start,hj:sj.hj||(y+1)+'-02-01',ende:sj.ende||sjEnde(start)};
}
function spModal(){
 SPI={};
 modal(`<h2>Stundenplan aus PDF übernehmen</h2>
 <div class="sub">Lade deinen Stundenplan als PDF hoch, z. B. aus Untis. Die App erkennt Tage, Stunden, Klasse, Fach, Raum und Halbjahr. Je ${S.set.spb||2} Stunden der PDF ergeben einen Block deines Stundenrasters. Die Datei bleibt auf diesem Gerät.</div>
 <label>PDF oder Foto<input type="file" id="sp_f" accept=".pdf,application/pdf,image/*"></label>
 <label class="chk"><input type="checkbox" id="sp_o"> Texterkennung erzwingen (für eingescannte Pläne)</label>
 <div class="sub" id="im_s"></div>
 <div class="btns"><button onclick="closeModal()">Abbrechen</button><button class="pri" onclick="spRead()">Einlesen</button></div>`);
}
async function spRead(){
 const f=$('#sp_f').files[0];if(!f)return imStat('Bitte eine Datei wählen.');
 try{
  let pages;
  if(f.type.startsWith('image/'))pages=[await ocrImages([f])];
  else{
   imStat('PDF wird gelesen …');await loadJS(LIB.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
   const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;pages=[];let chars=0;
   for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p),vh=pg.getViewport({scale:1}).height,tc=await pg.getTextContent(),ws=[];
    tc.items.forEach(it=>{const s=it.str.trim();if(!s)return;chars+=s.length;const tr=it.transform,h=it.height||Math.hypot(tr[2],tr[3])||9;ws.push({t:s,x0:tr[4],x1:tr[4]+(it.width||s.length*h*0.5),y:vh-tr[5],h:h})});pages.push(ws)}
   if($('#sp_o').checked||chars<20*doc.numPages){pages=[];
    for(let p=1;p<=doc.numPages;p++){imStat(`Seite ${p} wird für die Texterkennung vorbereitet …`);const pg=await doc.getPage(p),vp=pg.getViewport({scale:2.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pages.push((await ocrImages([c])).map(w=>Object.assign(w,{y:w.y+w.h/2})))}}
  }
  const out=[];let range=null;
  pages.forEach(ws=>{const r=spParse(ws);if(r){out.push(...r.cards);range=range||r.range}});
  if(!out.length)return imStat('Im Plan wurden keine Stunden erkannt. Sind die Tage (Mo–Fr) und die Stundennummern am Rand lesbar?');
  const d=sjDefault();
  SPI={rows:out,start:range&&range[0]||d.start,ende:range&&range[1]||d.ende,hj:d.hj,repl:true,neu:true};
  if(range&&range[0]){const y=+range[0].slice(0,4)+(+range[0].slice(5,7)>=8?1:0);if(!(S.set.sj&&S.set.sj.hj))SPI.hj=y+'-02-01'}
  spPreview();
 }catch(e){imStat('Fehler: '+(e&&e.message||e))}
}
const med=a=>{const s=a.slice().sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0};
function spParse(ws){
 /* Kopfzeile mit den Tagen */
 const dh=ws.filter(w=>DAYKEY.includes(w.t.toLowerCase().replace(/\.$/,'').slice(0,2))&&w.t.replace(/\.$/,'').length<=10);
 let best=[];dh.forEach(a=>{const g=dh.filter(b=>Math.abs(b.y-a.y)<a.h);if(g.length>best.length)best=g});
 if(best.length<3)return null;
 const hy=med(best.map(w=>w.y)),days=best.map(w=>({i:DAYKEY.indexOf(w.t.toLowerCase().slice(0,2)),c:(w.x0+w.x1)/2})).sort((a,b)=>a.c-b.c);
 const gap=med(days.slice(1).map((d,i)=>d.c-days[i].c))||80,left=days[0].c-gap/2;
 const dayOf=x=>{let k=-1,bd=1e9;days.forEach((d,i)=>{const dd=Math.abs(x-d.c);if(dd<bd){bd=dd;k=i}});return bd<=gap*0.62?days[k].i:-1};
 /* Stundennummern am linken Rand */
 const rl=ws.filter(w=>/^\d{1,2}\.?$/.test(w.t)&&w.x1<=left+gap*0.1&&w.y>hy).map(w=>({n:parseInt(w.t),y:w.y,w:w})).sort((a,b)=>a.y-b.y);
 const rows=[];rl.forEach(r=>{if(!rows.length||r.n===rows[rows.length-1].n+1)rows.push(r)});
 if(rows.length<2)return null;
 const rh=med(rows.slice(1).map((r,i)=>r.y-rows[i].y)),rowOf=y=>{let k=0;rows.forEach((r,i)=>{if(y>=r.y-rh*0.75)k=i});return rows[k].n};
 const bottom=rows[rows.length-1].y+rh*0.6,lab=new Set(rows.map(r=>r.w));
 /* Text im Raster zu Karten gruppieren: gleiche linke Kante oder gleiche Mitte, untereinander */
 const it=ws.filter(w=>!lab.has(w)&&w.y>hy+rh*0.4&&w.y<bottom&&w.x0>=left-gap*0.05&&dayOf((w.x0+w.x1)/2)>=0).map(w=>Object.assign({},w,{d:dayOf((w.x0+w.x1)/2),c:(w.x0+w.x1)/2}));
 const tol=med(it.map(w=>w.h))*0.45||4,grp=[];
 it.forEach(w=>{let g=grp.find(g=>g.d===w.d&&g.some(o=>Math.abs(o.x0-w.x0)<tol||Math.abs(o.c-w.c)<tol));if(g)g.push(w);else grp.push(Object.assign([w],{d:w.d}))});
 const gaps=[];grp.forEach(g=>{g.sort((a,b)=>a.y-b.y);g.slice(1).forEach((w,i)=>gaps.push(w.y-g[i].y))});
 const lg=med(gaps.filter(x=>x>0))||10,cls=/^([A-ZÄÖÜ]{1,8}\s?\d{1,4}[A-Za-z]{0,3}|\d{1,2}\s?[a-zA-Z]{1,3})\.?$/;
 const cards=[];
 grp.forEach(g=>{let cur=null;g.forEach(w=>{const dy=cur?w.y-cur[cur.length-1].y:0;
  if(!cur||dy>lg*1.3||(cls.test(w.t)&&cur.length>=4)){cur=[w];cur.d=g.d;cards.push(cur)}else cur.push(w)})});
 const res=cards.map(c=>{
  const o={on:true,tag:c.d,p1:rowOf(c[0].y),p2:rowOf(c[c.length-1].y),klasse:'',fach:'',raum:'',hj:''},rest=[];
  c.forEach((w,i)=>{const t=w.t.trim(),hm=t.match(/^([12])\s?\.?\s?(hj|halbj)/i);
   if(hm)o.hj=hm[1];else if(i===0&&cls.test(t))o.klasse=t.replace(/\.$/,'');else rest.push(t)});
  rest.forEach(t=>{if(!o.raum&&/^[A-Z]{0,3}\s?-?\d{2,4}[a-z]?$|raum|halle|aula|labor/i.test(t)&&(o.fach||rest.length===1||/\d/.test(t)))o.raum=t;else if(!o.fach)o.fach=t;else if(!o.raum)o.raum=t;else o.fach+=' '+t});
  const spb=S.set.spb||2;o.b1=Math.floor((o.p1-1)/spb);o.b2=Math.floor((o.p2-1)/spb);
  return o;
 }).filter(o=>o.klasse||o.fach);
 res.sort((a,b)=>a.tag-b.tag||a.p1-b.p1);
 const txt=ws.slice().sort((a,b)=>a.y-b.y||a.x0-b.x0).map(w=>w.t).join(' '),m=txt.match(/(\d{1,2}\.\d{1,2}\.\d{4})[^–-]{0,12}[–-]\s*(\d{1,2}\.\d{1,2}\.\d{4})/);
 return {cards:res,range:m?[isoDE(m[1]),isoDE(m[2])]:null};
}
const spKid=n=>{n=String(n||'').trim().replace(/\.$/,'').toUpperCase();const k=S.klassen.find(k=>k.name.trim().replace(/\.$/,'').toUpperCase()===n);return k?k.id:''};
function spCheck(k,r){
 if(k==='klasse')return !r.klasse.trim();
 if(k==='b1')return !(S.zeiten[r.b1]&&S.zeiten[r.b2]);
 if(k==='tag')return r.tag<0;
 return false;
}
const spBad=()=>SPI.rows.filter(r=>r.on).reduce((n,r)=>n+['klasse','b1','tag'].filter(k=>spCheck(k,r)).length,0);
function spSet(i,k,el){const r=SPI.rows[i];if(k==='b1'){const n=Math.max(0,r.b2-r.b1);r.b1=+el.value;r.b2=Math.min(S.zeiten.length-1,r.b1+n)}else r[k]=k==='tag'?+el.value:el.value;el.classList.toggle('bad',spCheck(k,r));SPI.force=false;spCnt();if(k==='klasse'){const t=el.closest('td').querySelector('.tag');if(t)t.style.display=spKid(r.klasse)?'none':''}}
function spCnt(){const e=$('#im_c');if(!e)return;const n=spBad(),on=SPI.rows.filter(r=>r.on).length;e.innerHTML=(n?`<span class="bad-l"></span> ${n} ${n===1?'Feld ist':'Felder sind'} rot markiert, bitte prüfen. `:'')+on+' von '+SPI.rows.length+' Stunden ausgewählt.'}
function spPreview(){
 SPI.force=false;
 const zs=S.zeiten.map((z,i)=>`<option value="${i}">${i+1}. Block ${z[0]}–${z[1]}</option>`).join('');
 modal(`<h2>Stundenplan prüfen <span class="sub">${SPI.rows.length} Stunden erkannt</span></h2>
 <div class="sub">Felder antippen zum Korrigieren. Abgewählte Zeilen werden nicht übernommen. „neu“ heißt: Die Klasse gibt es noch nicht.</div><div class="sub" id="im_c" style="margin-top:4px"></div>
 <div class="two" style="grid-template-columns:repeat(3,minmax(0,1fr))"><label>Schuljahr ab<input type="date" value="${SPI.start}" onchange="SPI.start=this.value"></label><label>2. Halbjahr ab<input type="date" value="${SPI.hj}" onchange="SPI.hj=this.value"></label><label>Schuljahr bis<input type="date" value="${SPI.ende}" onchange="SPI.ende=this.value"></label></div>
 <div class="imt" style="margin-top:12px"><table><tr><th></th><th>Tag</th><th>Block</th><th>Klasse</th><th>Fach</th><th>Raum</th><th>Halbjahr</th></tr>
 ${SPI.rows.map((r,i)=>`<tr class="${r.on?'':'off'}"><td><input type="checkbox" ${r.on?'checked':''} onchange="SPI.rows[${i}].on=this.checked;this.closest('tr').className=this.checked?'':'off';spCnt()"></td>
 <td><select class="${spCheck('tag',r)?'bad':''}" onchange="spSet(${i},'tag',this)">${DAYS.map((d,j)=>`<option value="${j}" ${r.tag===j?'selected':''}>${d}</option>`).join('')}</select></td>
 <td><select class="${spCheck('b1',r)?'bad':''}" onchange="spSet(${i},'b1',this)">${S.zeiten[r.b1]?'':`<option selected>Std. ${r.p1}–${r.p2}?</option>`}${zs.replace(`value="${r.b1}"`,`value="${r.b1}" selected`)}</select>${r.b2>r.b1?`<div class="sub">bis ${r.b2+1}. Block</div>`:''}</td>
 <td><input class="${spCheck('klasse',r)?'bad':''}" value="${esc(r.klasse)}" oninput="spSet(${i},'klasse',this)"><span class="tag ac neu" style="${spKid(r.klasse)?'display:none':''}">neu</span></td>
 <td><input value="${esc(r.fach)}" oninput="SPI.rows[${i}].fach=this.value"></td><td><input value="${esc(r.raum)}" oninput="SPI.rows[${i}].raum=this.value"></td>
 <td><select onchange="SPI.rows[${i}].hj=this.value">${HJT.map(h=>`<option value="${h[0]}" ${r.hj===h[0]?'selected':''}>${h[1]}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
 <label class="chk"><input type="checkbox" ${SPI.repl?'checked':''} onchange="SPI.repl=this.checked"> Früher aus PDF übernommenen Stundenplan ersetzen</label>
 <label class="chk"><input type="checkbox" ${SPI.neu?'checked':''} onchange="SPI.neu=this.checked"> Fehlende Klassen anlegen</label>
 <div class="sub" id="im_e" style="color:var(--bad);margin-top:10px"></div>
 <div class="btns"><button onclick="closeModal()">Abbrechen</button><button class="pri" onclick="spSave()">Übernehmen</button></div>`,'wide');
 spCnt();
}
function spSave(){
 const rows=SPI.rows.filter(r=>r.on);
 if(!rows.length)return imErr('Keine Stunden ausgewählt.');
 if(!SPI.start||!SPI.ende||!SPI.hj||SPI.hj<=SPI.start||SPI.ende<SPI.hj)return imErr('Bitte Schuljahr und 2. Halbjahr prüfen: Beginn < 2. Halbjahr ≤ Ende.');
 const nb=spBad();if(nb&&!SPI.force){SPI.force=true;return imErr(nb+(nb===1?' Feld ist':' Felder sind')+' noch rot markiert. Tippe noch einmal auf „Übernehmen“, um die übrigen Stunden trotzdem anzulegen.')}
 S.set.sj={start:SPI.start,hj:SPI.hj,ende:SPI.ende};
 if(SPI.repl)S.termine=S.termine.filter(t=>t.src!=='pdf');
 const hjEnd=iso(addD(new Date(SPI.hj+'T00:00:00'),-1));let n=0,nk=0;
 rows.forEach(r=>{
  if(spCheck('klasse',r)||spCheck('b1',r)||spCheck('tag',r))return;
  let kid=spKid(r.klasse);
  if(!kid){if(!SPI.neu)return;kid=uid();S.klassen.push({id:kid,name:r.klasse.trim().replace(/\.$/,''),fach:r.fach.trim()||S.set.faecher[0]||''});S.sitz[kid]=[];nk++}
  const st=r.hj==='2'?SPI.hj:SPI.start,en=r.hj==='1'?hjEnd:SPI.ende,first=iso(addD(new Date(st+'T00:00:00'),(r.tag-wdOf(st)+7)%7));
  S.termine.push({id:uid(),src:'pdf',kid:kid,titel:r.fach.trim(),raum:r.raum.trim(),von:S.zeiten[r.b1][0],bis:S.zeiten[r.b2][1],wdh:'woechentlich',tage:[r.tag],start:first,ende:en,ferien:true,aus:[]});n++;
 });
 save();closeModal();SPI=null;go({tab:'woche',spv:'woche',week:0});
 info(n+(n===1?' Stunde':' Stunden')+' übernommen'+(nk?', '+nk+(nk===1?' Klasse':' Klassen')+' neu angelegt':'')+'.');
}

 <div class="sub" style="margin-top:8px">Umbenennen ändert das Fach auch bei allen Klassen.</div></div>
 <div class="card"><h2>Automatische Sicherung</h2><div id="abst">${abStatus()}</div></div>
 <div class="card"><h2>Sicherung per Hand</h2><div class="sub">Letzte Sicherung: ${S.set.letzterExport?dshort(S.set.letzterExport):'noch nie'}. Alle Daten liegen nur in diesem Browser.</div>
 ${SHARE?'<button class="btn pri" onclick="shareJ()">Sichern über Teilen-Menü (Drive, Dateien)</button><button class="btn" onclick="exportJ()">Als Datei laden</button>':'<button class="btn pri" onclick="exportJ()">Sicherung exportieren</button>'}
 <label>Sicherung importieren<input type="file" accept=".json,application/json" onchange="importJ(this)"></label></div>
 <div class="card"><h2>Daten</h2><button class="btn" style="margin-top:0" onclick="ask('Demodaten laden? Aktuelle Daten werden ersetzt.',()=>{fotoClear();S=seed();save();go({tab:'heute'})})">Demodaten laden</button>
 <button class="btn dng" onclick="ask('Wirklich alles löschen?',()=>{fotoClear();S=emptyState();save();go({tab:'heute'})})">Alles löschen, leer starten</button></div></div></div>`;
 return h;
}
function sjSet(k,v){S.set.sj=Object.assign(sjDefault(),S.set.sj||{});S.set.sj[k]=v;save()}
function setPlan(t,i,v){if(v)S.plan[t+'-'+i]=v;else delete S.plan[t+'-'+i];save()}
function fachAdd(){const v=$('#f_n').value.trim();if(!v||S.set.faecher.includes(v))return;S.set.faecher.push(v);save();render()}
function fachRen(i,v){v=v.trim();const o=S.set.faecher[i];if(!v||v===o){render();return}S.set.faecher[i]=v;S.klassen.forEach(k=>{if(k.fach===o)k.fach=v});save();render()}
function fachDel(i){const f=S.set.faecher[i],n=S.klassen.filter(k=>k.fach===f).length;ask(n?`„${f}“ löschen? ${n} Klasse(n) behalten das Fach.`:`„${f}“ löschen?`,()=>{S.set.faecher.splice(i,1);save();render()})}
function setList(k,v){S.set[k]=v.split(',').map(x=>x.trim()).filter(Boolean);save()}
function emptyState(){const d=seed();return{klassen:[],schueler:[],plan:{},planung:{},termine:[],sitz:{},zeiten:d.zeiten,set:Object.assign({},d.set,{letzterExport:null})}}
function exportJ(){
 S.set.letzterExport=iso(new Date());save();
 const b=new Blob([JSON.stringify(Object.assign({},S,{fotos:FOTO}),null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='lehrer-dashboard-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();render();
}
function importJ(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{let j;try{j=JSON.parse(r.result);if(!j.klassen||!j.schueler)throw 0}catch(e){return info('Die Datei ist keine gültige Sicherung.')}
  ask('Alle aktuellen Daten durch die Sicherung ersetzen?',()=>{fotoClear();const fo=j.fotos||{};delete j.fotos;Object.keys(fo).forEach(k=>fotoPut(k,fo[k]));S=normalize(j);save();go({tab:'heute'})})};
 r.readAsText(f);
}
/* ===== iPad: Teilen-Sicherung, Erinnerung, PWA ===== */
const SHARE=(()=>{try{return typeof navigator!=='undefined'&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]})}catch(e){return false}})();
const STANDALONE=(()=>{try{return (window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)}catch(e){return false}})();
let _remindOff=false,PERSIST=null;
function backupFile(){return new File([JSON.stringify(Object.assign({},S,{fotos:FOTO}),null,1)],'lehrer-dashboard-backup-'+iso(new Date())+'.json',{type:'application/json'})}
async function shareJ(){
 const f=backupFile();
 try{await navigator.share({files:[f],title:'Lehrer-Dashboard Sicherung'});S.set.letzterExport=iso(new Date());save();render()}
 catch(e){if(e&&e.name==='AbortError')return;exportJ()}
}
function daysSince(d){return Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/864e5)}
function remindHtml(){
 if(_remindOff||(AB.h&&AB.perm))return '';
 const le=S.set.letzterExport,ref=le||S.set.start;if(!ref||!S.klassen.length)return '';
 const n=daysSince(ref);if(le?n<7:n<3)return '';
 return `<div class="ban">${le?'Die letzte Sicherung ist '+n+' Tage her.':'Es gibt noch keine Sicherung.'} <button class="mini pri" onclick="${SHARE?'shareJ()':'exportJ()'}">Jetzt sichern</button><button class="mini" onclick="_remindOff=true;render()">Später</button></div>`;
}
function pwaStatus(){
 const per=PERSIST===true?'Der Browser hat zugesagt, die Daten dauerhaft zu behalten.':PERSIST===false?'Der Browser hat den Dauerspeicher noch nicht zugesagt. Eine Sicherung ist daher wichtig.':'';
 if(STANDALONE)return `<div class="sub">Läuft als App vom Home-Bildschirm. ${per}</div>`;
 return `<div class="sub">In Safari: Teilen-Symbol, dann „Zum Home-Bildschirm“. So startet das Dashboard im Vollbild, funktioniert ohne Netz und Safari löscht die Daten nicht nach einer Woche Pause. ${per}</div>`;
}
(function pwaInit(){
 try{if(!S.set.start){S.set.start=iso(new Date());save()}}catch(e){}
 try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(v=>{PERSIST=v;if(!v)return navigator.storage.persist().then(x=>{PERSIST=x})}).then(()=>{const e=$('#pwst');if(e)e.innerHTML=pwaStatus()}).catch(()=>{})}}catch(e){}
 /* Offline-Cache; nach einem Update lädt die App sich einmal selbst neu */
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
 const had=!!navigator.serviceWorker.controller;let re=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!re){re=true;location.reload()}});
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})).catch(()=>{}));
}}catch(e){}
})();
initTop();render();fotoLoad();abLoad();
</script>
</body>
</html>
